[package]
name = "guard-hook"
version = "0.3.0"
edition = "2021"
description = "KimiCodeGuard PreToolUse hook 薄 shim 与 config 注入器"

[lib]
name = "guard_hook"
path = "src/lib.rs"

[[bin]]
name = "guard-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
toml = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
