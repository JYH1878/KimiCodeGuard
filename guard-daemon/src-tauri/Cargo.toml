[package]
name = "guard-daemon"
version = "0.1.0"
description = "KimiCodeGuard 托盘守护进程：ask 弹窗服务端"
edition = "2021"
rust-version = "1.77.2"

# 独立 workspace：不进根 Cargo workspace（根 release profile 的 panic=abort 是 hook 专用）
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

# 命名管道服务端（CreateNamedPipeW / ConnectNamedPipe / DisconnectNamedPipe）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
] }
