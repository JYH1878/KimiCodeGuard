[package]
name = "guard-daemon"
version = "0.1.0"
description = "KimiCodeGuard 托盘守护进程：ask 弹窗服务端"
edition = "2021"
rust-version = "1.77.2"

# 独立 workspace：不进根 Cargo workspace（根 release profile 的 panic=abort 是 hook 专用）
[workspace]

# custom-protocol：tauri 的生产模式开关（官方模板固定写法，DO NOT REMOVE）。
# 无此 feature 时 tauri 按 dev 模式构建（build.rs: dev = !custom_protocol）——
# 不内嵌 frontendDist、窗口走 devUrl，裸 cargo build --release 会产出「弹窗
# localhost 拒绝连接」的坏 exe（2026-08-14 M3 验收实踩）。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
# 审计轨 A：SQLite 落库（bundled = 内置编译 SQLite，不依赖系统 dll）
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

    # 命名管道服务端（CreateNamedPipeW / ConnectNamedPipe / DisconnectNamedPipe）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    # 托盘消息框（MessageBoxW）与本地时间戳（GetLocalTime），审计校验/导出用
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
] }
